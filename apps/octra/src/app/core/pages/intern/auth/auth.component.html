<div class="row">
  <div class="col-md-4">
    <img
      id="logo"
      src="assets/img/tratt/tratt-favicon-transparent.svg"
      alt="TRATT"
      width="96"
      height="96"
    />

    <table>
      <tbody>
        <tr>
          <td>
            <i class="bi bi-person-check fs-3" style="color: var(--octra-accent-green)"></i>
          </td>
          <td>
            <h2>{{ 'authentication.you are authenticated' | transloco }}</h2>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="col-md-8">
    <img
      src="../../../../../assets/img/authenticated.jpg"
      alt="Authenticated OCTRA user illustration"
    />
  </div>
</div>

<p style="margin-top: 20px">{{ 'authentication.description' | transloco }}</p>
<p style="font-weight: bold">
  {{
    'authentication.window closed'
      | transloco
        : {
            seconds: secondsToClose,
          }
  }}
</p>
