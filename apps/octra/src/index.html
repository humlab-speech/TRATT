<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <link rel="manifest" id="manifest" href="manifest.json" />
    <meta charset="utf-8" />
    <title>TRATT - Orthographic Transcription</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="author"
      content="Julian Pömp, Christoph Draxler; Institut für Phonetik und Sprachverarbeitung, LMU München"
    />
    <meta
      content="OCTRA is a modern online tool for the orthographic transcription of audio files.
    It can be used online or local and is free to use. What makes it special is its user-friendly appearance and its features:
    multiple editors and tiers, auto-saving, transcription guidelines support of various file formats and a lot more."
      name="description"
    />

    <!-- icons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/img/tratt/tratt-favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="assets/img/tratt/icons/256x256.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/img/tratt/icons/32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/img/tratt/icons/16x16.png"
    />
    <meta name="apple-mobile-web-app-title" content="TRATT" />
    <meta name="application-name" content="TRATT" />
    <!-- end icons -->

    <!-- Facebook -->
    <meta content="article" property="og:type" />
    <meta property="og:image" content="assets/img/tratt/social-card.png" />
    <meta content="TRATT - orthographic transcription" property="og:title" />
    <meta content="features" property="og:url" />
    <meta
      content="OCTRA is a modern online tool for the orthographic transcription of audio files. It can be used online or local and is free to use. What makes it special is its user-friendly appearance and its features: multiple editors and tiers, auto-saving, transcription guidelines support various file formats and a lot more."
      property="og:description"
    />
    <!-- end Facebook -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="assets/img/tratt/social-card.png" />
    <meta content="TRATT - orthographic transcription" name="twitter:title" />
    <meta
      content="OCTRA is a modern  and free online tool for the orthographic transcription of audio files.
    It can be used with online files or local files from your computer."
      name="twitter:description"
    />
    <!-- end Twitter-->

    <style>
      #logo {
        display: block;
        width: 96px;
        max-width: 40%;
        height: auto;
        margin: 0 auto 20px;
      }

      .progress {
        height: 4px;
        border-radius: 0;
        -webkit-box-shadow: none;
        box-shadow: none;
        background: var(--octra-surface-sunken);
      }

      .progress .progress-bar {
        -webkit-box-shadow: none;
        box-shadow: none;
      }

      .progress {
        height: 10px !important;
        background: transparent !important;
        border: 1px solid var(--octra-chrome) !important;
      }

      .progress-bar {
        background-color: var(--octra-chrome) !important;
      }
    </style>
    <script type="application/javascript" id="build_meta">
      // Do not remove the following code
      /*
        var BUILD = {
           "version": "0.0.0",
            "hash": "1234-1234-1234-1234",
            "timestamp": "23.11.23 12:00"
         };
       */
    </script>
  </head>
  <body>
    <octra-app>
      <div id="loading" style="margin-top: 150px; padding: 20px">
        <img
          id="logo"
          src="assets/img/tratt/tratt-favicon-transparent.svg"
          alt="TRATT"
          width="96"
          height="96"
        />
        <div class="progress">
          <div class="progress-bar progress-animated" style="width: 100%"></div>
        </div>
        <div class="description" style="margin-top: 20px; text-align: center">
          Please wait... TRATT is loading...
        </div>
        <noscript>
          <p style="text-align: center; color: red">
            You need Javascript to use this Web-application
          </p>
        </noscript>
      </div>
    </octra-app>
  </body>
</html>
