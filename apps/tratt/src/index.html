<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the stored theme before Angular boots (ThemeService takes over).
      try {
        var t = localStorage.getItem('tratt.theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    </script>
    <base href="/" />
    <link rel="manifest" id="manifest" href="manifest.json" />
    <meta charset="utf-8" />
    <title>Tratt – Språkbankens transkriberingsverktyg</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="author"
      content="Julian Pömp, Christoph Draxler; Institut für Phonetik und Sprachverarbeitung, LMU München"
    />
    <meta
      content="Tratt is a modern online tool for the orthographic transcription of audio files.
    It can be used online or local and is free to use. What makes it special is its user-friendly appearance and its features:
    multiple editors and tiers, auto-saving, transcription guidelines support of various file formats and a lot more."
      name="description"
    />

    <!-- icons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/img/tratt/tratt-favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="assets/img/tratt/icons/256x256.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/img/tratt/icons/32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/img/tratt/icons/16x16.png"
    />
    <meta name="apple-mobile-web-app-title" content="Tratt" />
    <meta name="application-name" content="Tratt" />
    <!-- end icons -->

    <!-- Facebook -->

    <meta
      content="Tratt – Språkbankens transkriberingsverktyg"

    <meta
      content="Tratt is a modern online tool for the orthographic transcription of audio files. It can be used online or local and is free to use. What makes it special is its user-friendly appearance and its features: multiple editors and tiers, auto-saving, transcription guidelines support various file formats and a lot more."
      property="og:description"
    />
    <!-- end Facebook -->

    <!-- Twitter -->

    />
    <meta
      content="Tratt is a modern and free online tool for the orthographic transcription of audio files.
    It can be used with online files or local files from your computer."

    />
    <!-- end Twitter-->

    <style>
