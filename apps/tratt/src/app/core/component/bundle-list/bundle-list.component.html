<!--
  Switches between bundles created by the single startSession() call at
  session start. Does NOT support dropping more files into an
  already-active session — see BundleListComponent's doc comment.

  A bundle restored from IndexedDB with no audio resident this session
  (`awaitingMedia`, step 2.8 Task 4) renders a re-attach file input instead
  of the click-to-select button (step 2.8 Task 5).
-->
@if (bundles().length > 0) {
  <h6 class="bundle-list__title">
    {{ 'workbench.bundle_list.title' | transloco }}
  </h6>
}
<ul class="bundle-list">
  @for (bundle of bundles(); track bundle.bundleId) {
    <li class="bundle-list__item" [class.active]="bundle.selected">
      @if (bundle.awaitingMedia) {
        <label
          class="bundle-list__reattach-label"
          [attr.for]="'bundle-reattach-' + bundle.bundleId"
        >
          <!-- `bundle.name` comes from `sessionFile?.name`; sessionFile is a
               required prop on the createBundle action, so this is always
               populated in practice for LOCAL bundles — no placeholder
               fallback needed. -->
          {{ bundle.name }} — {{ 'workbench.bundle_list.reattach' | transloco }}
        </label>
        <input
          type="file"
          accept="audio/*"
          [id]="'bundle-reattach-' + bundle.bundleId"
          class="bundle-list__reattach-input"
          (change)="onReattachFileSelected(bundle.bundleId, $event)"
        />
      } @else {
        <button
          type="button"
          class="bundle-list__item-btn"
          (click)="selectBundle(bundle.bundleId)"
        >
          <!-- `bundle.name` comes from `sessionFile?.name`; sessionFile is a
               required prop on the createBundle action, so this is always
               populated in practice for LOCAL bundles — no placeholder
               fallback needed. -->
          {{ bundle.name }}
        </button>
      }
    </li>
  }
</ul>
