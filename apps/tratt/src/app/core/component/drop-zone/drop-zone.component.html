<div style="position: relative">
  <div
    #dropzone
    (click)="onClick()"
    (keydown.enter)="onClick()"
    (keydown.space)="$event.preventDefault(); onClick()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onFileDrop($event)"
    [class.dropzone--over]="isOver()"
    [ngStyle]="{
      height: height,
    }"
    class="dropzone"
    tabindex="0"
  >
    <div class="inner">
      @if (showIcon) {
        <i class="fa-solid fa-folder-open dragndrop"></i>
      }
      <ng-content></ng-content>
      <input
        #fileinput
        (change)="onFileChange($event)"
        class="fileinput"
        multiple
        style="display: none"
        type="file"
        value="Select audio file"
      />
    </div>
  </div>
</div>
