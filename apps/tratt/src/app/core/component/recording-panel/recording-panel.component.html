<tratt-recording-recovery-banner
  *ngIf="recoverable.length > 0"
  [sessions]="recoverable"
  (continueSession)="onContinueRecovery($event)"
  (downloadSession)="onDownloadRecovery($event)"
  (discardSession)="onDiscardRecovery($event)"
></tratt-recording-recovery-banner>

<div class="recording-panel border rounded p-2 mt-2">
  <div class="recording-toolbar">
    <ng-container *ngIf="service.state$ | async as state">
      <ng-container *ngIf="!staged">
        <div class="recording-toolbar__left">
          <span
            class="text-muted small"
            *ngIf="state === 'idle' || state === 'error'"
          >
            {{ 'recording.hint' | transloco }}
          </span>
        </div>

        <div
          class="recording-toolbar__center d-flex align-items-center gap-2 flex-wrap justify-content-center"
        >
          <div
            class="btn-group btn-group-sm"
            role="group"
            [attr.aria-label]="'recording.mode.aria label' | transloco"
            *ngIf="state === 'idle' || state === 'error'"
          >
            <button
              type="button"
              class="btn"
              [class.btn-secondary]="selectedMode === 'audio'"
              [class.btn-outline-secondary]="selectedMode !== 'audio'"
              [attr.aria-pressed]="selectedMode === 'audio'"
              [attr.aria-label]="'recording.mode.audio' | transloco"
              [ngbTooltip]="'recording.mode.audio' | transloco"
              container="body"
              (click)="onSelectMode('audio')"
            >
              <i class="bi bi-mic-fill"></i>
            </button>
            <button
              type="button"
              class="btn"
              [class.btn-secondary]="selectedMode === 'audio+video'"
              [class.btn-outline-secondary]="selectedMode !== 'audio+video'"
              [attr.aria-pressed]="selectedMode === 'audio+video'"
              [attr.aria-label]="'recording.mode.audio+video' | transloco"
              [ngbTooltip]="'recording.mode.audio+video' | transloco"
              container="body"
              (click)="onSelectMode('audio+video')"
            >
              <i class="bi bi-camera-video-fill"></i>
            </button>
            <tratt-device-picker [mode]="selectedMode"></tratt-device-picker>
          </div>

          <button
            type="button"
            class="btn btn-danger btn-sm"
            *ngIf="state === 'idle' || state === 'error'"
            (click)="onStart()"
          >
            <i class="bi bi-record-circle"></i>
            {{ 'recording.start' | transloco }}
          </button>
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            *ngIf="state === 'requesting-permission'"
            disabled
          >
            <span class="spinner-border spinner-border-sm" role="status"></span>
            {{ 'recording.requesting permission' | transloco }}
          </button>
          <button
            type="button"
            class="btn btn-dark btn-sm"
            *ngIf="state === 'recording' || state === 'paused'"
            (click)="onStop()"
          >
            <i class="bi bi-stop-circle"></i>
            {{ 'recording.stop' | transloco }}
          </button>
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            *ngIf="state === 'recording' || state === 'paused'"
            (click)="onDiscard()"
          >
            {{ 'recording.discard' | transloco }}
          </button>

          <span
            class="text-muted small ms-2"
            *ngIf="
              state === 'recording' ||
              state === 'paused' ||
              state === 'stopping'
            "
          >
            {{ formatElapsed((service.elapsed$ | async) ?? 0) }}
          </span>

          <ng-container *ngIf="state === 'recording' || state === 'paused'">
            <ng-container *ngIf="service.levels$ | async as levels">
              <tratt-vu-meter
                class="ms-2"
                [peakDb]="levels.peakDb"
                [rmsDb]="levels.rmsDb"
              ></tratt-vu-meter>

              <span
                class="level-light ms-1"
                [class.level-light--red]="
                  levelLightStatus(levels.rmsDb) === 'red'
                "
                [class.level-light--orange]="
                  levelLightStatus(levels.rmsDb) === 'orange'
                "
                [class.level-light--green]="
                  levelLightStatus(levels.rmsDb) === 'green'
                "
                role="status"
                aria-live="polite"
                [attr.aria-label]="
                  'recording.level light.' + levelLightStatus(levels.rmsDb)
                    | transloco
                "
                [ngbTooltip]="
                  'recording.level light.' + levelLightStatus(levels.rmsDb)
                    | transloco
                "
                container="body"
              >
                <i class="bi bi-circle-fill"></i>
              </span>
            </ng-container>

            <span
              class="text-muted small ms-1"
              *ngIf="service.chunkPersisted$ | async as chunks"
            >
              <ng-container *ngIf="chunks.bytes > 0">
                {{ chunks.bytes / 1048576 | number: '1.0-1' }} MB
              </ng-container>
            </span>
          </ng-container>
        </div>

        <div class="recording-toolbar__right"></div>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="staged">
      <div class="recording-toolbar__left"></div>
      <div
        class="recording-toolbar__center d-flex align-items-center gap-2 flex-wrap justify-content-center"
      >
        <span class="badge text-bg-success">
          <i class="bi bi-check2-circle"></i>
          {{ 'recording.ready' | transloco }}
        </span>
        <span class="text-muted small">{{ staged.file.name }}</span>
        <button type="button" class="btn btn-primary btn-sm" (click)="onUse()">
          {{ 'recording.use' | transloco }}
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="onDownload()"
        >
          <i class="bi bi-download"></i>
          {{ 'recording.download' | transloco }}
        </button>
        <button
          type="button"
          class="btn btn-outline-danger btn-sm"
          (click)="onDiscard()"
        >
          {{ 'recording.discard' | transloco }}
        </button>
      </div>
      <div class="recording-toolbar__right"></div>
    </ng-container>
  </div>

  <div *ngIf="previewStream" class="mt-2" style="max-width: 240px">
    <video
      autoplay
      muted
      playsinline
      [srcObject]="previewStream"
      style="width: 100%; border-radius: 4px; background: #000"
    ></video>
  </div>

  <div *ngIf="showFirefoxWebmNotice" class="text-muted small mt-1">
    <i class="bi bi-info-circle"></i>
    {{ 'recording.firefox webm notice' | transloco }}
  </div>

  <div
    *ngIf="errorMessage"
    class="alert alert-danger py-1 px-2 mt-2 mb-0 small"
  >
    {{ errorMessage }}
  </div>
</div>
