<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title" id="visp-bundle-status-title">
      {{ bundleName }}
    </h5>
    <button
      type="button"
      class="btn-close"
      [attr.aria-label]="'g.close' | transloco"
      (click)="close()"
    ></button>
  </div>
  <div class="modal-body">
    <p class="visp-bundle-status__intro">
      {{ 'workbench.visp.status.intro' | transloco }}
    </p>
    <div class="form-check mb-3">
      <input
        id="visp-bundle-status-finished"
        type="checkbox"
        class="form-check-input"
        [(ngModel)]="finishedEditing"
      />
      <label class="form-check-label" for="visp-bundle-status-finished">
        {{ 'workbench.visp.status.finished' | transloco }}
      </label>
    </div>
    <label class="form-label" for="visp-bundle-status-comment">
      {{ 'workbench.visp.comment' | transloco }}
    </label>
    <textarea
      id="visp-bundle-status-comment"
      class="form-control"
      rows="4"
      [(ngModel)]="comment"
      [attr.placeholder]="
        'workbench.visp.status.comment_placeholder' | transloco
      "
    ></textarea>
  </div>
  <div class="modal-footer">
    <button (click)="close()" class="btn btn-outline-secondary" type="button">
      {{ 'g.cancel' | transloco }}
    </button>
    <button (click)="save()" class="btn btn-primary" type="button">
      {{ 'workbench.visp.save' | transloco }}
    </button>
  </div>
</div>
