<div id="transcr-end">
  <div class="container" style="width: 900px">
    <div class="text-center">
      <i
        class="fa-solid fa-circle-check"
        style="color: var(--tratt-success-text); font-size: 6.25rem"
      ></i>
    </div>
    <div class="well well-large">
      <p>{{ 'transcription submitted.no jobs left' | transloco }}</p>
    </div>
    <div class="row">
      <div class="col-md-6">
        <button
          type="button"
          (click)="backToProjectsList()"
          class="btn btn-primary"
          style="width: 100%"
        >
          {{ 'p.back to projects' | transloco }}
        </button>
      </div>
      <div class="col-md-6">
        <button
          type="button"
          (click)="leave()"
          class="btn btn-secondary"
          style="width: 100%"
        >
          {{ 'transcription submitted.quit' | transloco }}
        </button>
      </div>
    </div>
  </div>
</div>
