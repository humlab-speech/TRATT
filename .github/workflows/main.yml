name: documentation

# Publishes both documentation sites to GitHub Pages via the native Actions
# deploy (Settings > Pages > Build and deployment > Source: GitHub Actions):
#   /        typedoc API documentation for the libraries
#   /manual  the TRATT user manual, generated from docs/manual
#
# Both outputs are merged into one directory (dist/pages) before a single
# artifact upload, so there's no risk of one deploy overwriting the other.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Fails the build if a page, anchor or app deep link no longer resolves.
      - name: Validate user manual links
        run: npm run validate:manual

      - name: Build the user manual
        run: npm run build:manual

      - name: Build the API documentation
        run: npx typedoc --out typedocs && node runner.js prepare:docs

      - name: Assemble combined Pages site
        run: |
          mkdir -p dist/pages/manual
          cp -r typedocs/. dist/pages/
          cp -r dist/manual/. dist/pages/manual/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
